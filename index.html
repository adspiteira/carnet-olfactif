<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Carnet olfactif" />
  <meta name="theme-color" content="#F2EBDF" />
  <title>Carnet olfactif</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F2EBDF; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useMemo } = React;

/* ------------------------------------------------------------------ */
/*  Données fixes                                                      */
/* ------------------------------------------------------------------ */
const PERFUMES = [
  { id: "layton", name: "Layton", brand: "Parfums de Marly", conc: "EDP" },
  { id: "couleur-nuit", name: "La Couleur de la Nuit", brand: "Voyages Imaginaires", conc: "EDP" },
  { id: "sel-marin", name: "Sel Marin", brand: "Heeley", conc: "EDP" },
  { id: "african-leather", name: "African Leather", brand: "Memo", conc: "EDP" },
  { id: "megamare", name: "Megamare", brand: "Orto Parisi", conc: "Extrait" },
  { id: "herod", name: "Herod", brand: "Parfums de Marly", conc: "EDP" },
  { id: "b683", name: "B683", brand: "Marc-Antoine Barrois", conc: "EDP" },
  { id: "geranium-odorata", name: "Géranium Odorata", brand: "Diptyque", conc: "EDT" },
];

const SCALE = [
  { v: 1, label: "Non" },
  { v: 2, label: "Bof" },
  { v: 3, label: "Sympa" },
  { v: 4, label: "J'aime" },
  { v: 5, label: "Whoaou" },
];

const STORAGE_KEY = "parfum-suivi-v1";
const TARGET_TESTS = 3;

const C = {
  paper: "#F2EBDF",
  card: "#FBF6EC",
  ink: "#23201A",
  muted: "#857A66",
  line: "#E3D9C6",
  a: "#C2542E", // Moi
  b: "#2F6B63", // Ma copine
};

/* ------------------------------------------------------------------ */
/*  Persistance — localStorage (fonctionne sur site déployé)           */
/* ------------------------------------------------------------------ */
const DEFAULT_DATA = { raters: { a: "Moi", b: "Ma copine" }, sessions: [] };

const STORAGE_OK = (() => {
  try {
    const k = "__carnet_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
})();

function loadData() {
  if (!STORAGE_OK) return DEFAULT_DATA;
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.error("Lecture impossible", e);
  }
  return DEFAULT_DATA;
}

function persist(data) {
  if (!STORAGE_OK) return false;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Sauvegarde impossible", e);
    return false;
  }
}

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
const avg = (arr) => (arr.length ? arr.reduce((s, n) => s + n, 0) / arr.length : null);
const fmt = (n) => (n == null ? "–" : n.toFixed(1).replace(".", ","));
const dateFR = (iso) =>
  new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

/* ------------------------------------------------------------------ */
/*  App                                                                */
/* ------------------------------------------------------------------ */
function App() {
  const [data, setData] = useState(() => loadData());
  const [active, setActive] = useState(null); // perfume id (bottom sheet)
  const [settings, setSettings] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saved | failed

  function commit(next) {
    setData(next);
    const ok = persist(next);
    setSaveStatus(ok ? "saved" : "failed");
    if (ok) setTimeout(() => setSaveStatus((s) => (s === "saved" ? "idle" : s)), 1500);
  }

  function addSession(perfumeId, noteA, noteB, comment) {
    const session = {
      id: Date.now().toString(36),
      perfumeId,
      ts: new Date().toISOString(),
      noteA: noteA || null,
      noteB: noteB || null,
      comment: comment.trim(),
    };
    commit({ ...data, sessions: [session, ...data.sessions] });
  }
  function deleteSession(id) {
    commit({ ...data, sessions: data.sessions.filter((s) => s.id !== id) });
  }
  function setRaters(a, b) {
    commit({ ...data, raters: { a: a.trim() || "Moi", b: b.trim() || "Ma copine" } });
  }
  function resetAll() {
    commit({ raters: data.raters, sessions: [] });
  }

  /* stats par parfum */
  const stats = useMemo(() => {
    const map = {};
    for (const p of PERFUMES) {
      const ss = data.sessions.filter((s) => s.perfumeId === p.id);
      const notesA = ss.map((s) => s.noteA).filter(Boolean);
      const notesB = ss.map((s) => s.noteB).filter(Boolean);
      const all = [...notesA, ...notesB];
      map[p.id] = {
        count: ss.length,
        avgA: avg(notesA),
        avgB: avg(notesB),
        combined: avg(all),
        sessions: ss,
      };
    }
    return map;
  }, [data.sessions]);

  /* classement : testés (combined desc) puis non testés */
  const ranked = useMemo(() => {
    const tested = PERFUMES.filter((p) => stats[p.id].count > 0).sort(
      (x, y) => stats[y.id].combined - stats[x.id].combined
    );
    const untested = PERFUMES.filter((p) => stats[p.id].count === 0);
    return { tested, untested };
  }, [stats]);

  const totalTests = data.sessions.length;
  const triedCount = PERFUMES.length - ranked.untested.length;

  return (
    <Shell>
      {/* En-tête */}
      <header style={{ padding: "26px 20px 14px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h1
              style={{
                fontFamily: "Fraunces, serif",
                fontWeight: 600,
                fontSize: 30,
                lineHeight: 1.05,
                color: C.ink,
                margin: 0,
                letterSpacing: "-0.02em",
              }}
            >
              Carnet olfactif
            </h1>
            <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 13, color: C.muted, margin: "6px 0 0" }}>
              8 échantillons · {totalTests} test{totalTests > 1 ? "s" : ""} · {triedCount}/8 goûtés
            </p>
          </div>
          <button onClick={() => setSettings(true)} style={iconBtn}>
            Réglages
          </button>
        </div>
        {!STORAGE_OK && (
          <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12, color: C.a, margin: "10px 0 0", lineHeight: 1.45 }}>
            ⚠ Stockage indisponible sur ce navigateur (mode privé ?) — les notes ne seront pas gardées.
          </p>
        )}
        {STORAGE_OK && saveStatus === "failed" && (
          <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12, color: C.a, margin: "10px 0 0", lineHeight: 1.45 }}>
            ⚠ Échec de sauvegarde — rouvre le parfum et ré-enregistre le test.
          </p>
        )}
        {STORAGE_OK && saveStatus === "saved" && (
          <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12, color: C.b, margin: "10px 0 0" }}>
            ✓ Enregistré
          </p>
        )}
      </header>

      {/* Légende */}
      <div
        style={{
          display: "flex",
          gap: 16,
          padding: "0 20px 14px",
          fontFamily: "Hanken Grotesk, sans-serif",
          fontSize: 12,
          color: C.muted,
        }}
      >
        <span><Dot c={C.a} /> {data.raters.a}</span>
        <span><Dot c={C.b} /> {data.raters.b}</span>
      </div>

      {/* Classement */}
      <main style={{ padding: "0 14px 40px" }}>
        {ranked.tested.map((p, i) => (
          <PerfumeCard
            key={p.id}
            perfume={p}
            stat={stats[p.id]}
            rank={i + 1}
            raters={data.raters}
            isTop={i === 0 && stats[p.id].count >= 2}
            onTap={() => setActive(p.id)}
          />
        ))}

        {ranked.untested.length > 0 && (
          <p
            style={{
              fontFamily: "Hanken Grotesk, sans-serif",
              fontSize: 12,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
              color: C.muted,
              margin: "22px 8px 8px",
            }}
          >
            Pas encore testés
          </p>
        )}
        {ranked.untested.map((p) => (
          <PerfumeCard
            key={p.id}
            perfume={p}
            stat={stats[p.id]}
            rank={null}
            raters={data.raters}
            isTop={false}
            onTap={() => setActive(p.id)}
          />
        ))}
      </main>

      {/* Feuille de test */}
      {active && (
        <TestSheet
          perfume={PERFUMES.find((p) => p.id === active)}
          stat={stats[active]}
          raters={data.raters}
          onClose={() => setActive(null)}
          onSave={addSession}
          onDelete={deleteSession}
        />
      )}

      {/* Réglages */}
      {settings && (
        <SettingsSheet
          raters={data.raters}
          onClose={() => setSettings(false)}
          onSaveNames={setRaters}
          onReset={resetAll}
        />
      )}
    </Shell>
  );
}

/* ------------------------------------------------------------------ */
/*  Coquille + polices                                                 */
/* ------------------------------------------------------------------ */
function Shell({ children }) {
  return (
    <div
      style={{
        minHeight: "100vh",
        background: C.paper,
        backgroundImage:
          "radial-gradient(circle at 30% 0%, rgba(255,255,255,0.5), transparent 60%)",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; border: none; background: none; }
        @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      `}</style>
      <div style={{ maxWidth: 480, margin: "0 auto" }}>{children}</div>
    </div>
  );
}

const iconBtn = {
  fontFamily: "Hanken Grotesk, sans-serif",
  fontSize: 12,
  color: C.muted,
  border: `1px solid ${C.line}`,
  borderRadius: 999,
  padding: "6px 12px",
};

function Dot({ c }) {
  return (
    <span
      style={{
        display: "inline-block",
        width: 8,
        height: 8,
        borderRadius: 999,
        background: c,
        marginRight: 5,
        verticalAlign: "middle",
      }}
    />
  );
}

/* ------------------------------------------------------------------ */
/*  Carte parfum                                                       */
/* ------------------------------------------------------------------ */
function PerfumeCard({ perfume, stat, rank, raters, isTop, onTap }) {
  const tested = stat.count > 0;
  return (
    <button
      onClick={onTap}
      style={{
        width: "100%",
        textAlign: "left",
        background: C.card,
        border: `1px solid ${isTop ? C.a : C.line}`,
        borderRadius: 16,
        padding: "14px 16px",
        marginBottom: 10,
        display: "block",
        boxShadow: isTop ? `0 4px 18px rgba(194,84,46,0.13)` : "0 1px 3px rgba(0,0,0,0.03)",
        animation: "fade .4s ease both",
      }}
    >
      <div style={{ display: "flex", justifyContent: "space-between", gap: 12 }}>
        <div style={{ minWidth: 0 }}>
          {isTop && (
            <span
              style={{
                fontFamily: "Hanken Grotesk, sans-serif",
                fontSize: 10,
                fontWeight: 600,
                letterSpacing: "0.1em",
                textTransform: "uppercase",
                color: C.a,
              }}
            >
              ✦ Coup de cœur
            </span>
          )}
          <div
            style={{
              fontFamily: "Fraunces, serif",
              fontWeight: 600,
              fontSize: 19,
              color: C.ink,
              letterSpacing: "-0.01em",
              marginTop: isTop ? 2 : 0,
            }}
          >
            {rank && <span style={{ color: C.muted, fontSize: 15 }}>{rank}. </span>}
            {perfume.name}
          </div>
          <div style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12.5, color: C.muted, marginTop: 2 }}>
            {perfume.brand} · {perfume.conc}
          </div>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 30, color: tested ? C.ink : C.line, lineHeight: 1 }}>
            {fmt(stat.combined)}
            <span style={{ fontSize: 13, color: C.muted }}> /5</span>
          </div>
          <div style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 11, color: C.muted, marginTop: 3 }}>
            {tested ? `${stat.count}/${TARGET_TESTS} test${stat.count > 1 ? "s" : ""}` : "à tester"}
          </div>
        </div>
      </div>

      {tested && (
        <div style={{ display: "flex", gap: 14, marginTop: 12 }}>
          <MiniBar label={raters.a} value={stat.avgA} color={C.a} />
          <MiniBar label={raters.b} value={stat.avgB} color={C.b} />
        </div>
      )}
      {!tested && (
        <div style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12.5, color: C.a, marginTop: 10, fontWeight: 500 }}>
          Lancer un test →
        </div>
      )}
    </button>
  );
}

function MiniBar({ label, value, color }) {
  const pct = value ? (value / 5) * 100 : 0;
  return (
    <div style={{ flex: 1 }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontFamily: "Hanken Grotesk, sans-serif",
          fontSize: 11,
          color: C.muted,
          marginBottom: 3,
        }}
      >
        <span>{label}</span>
        <span style={{ color: C.ink, fontWeight: 600 }}>{fmt(value)}</span>
      </div>
      <div style={{ height: 5, background: C.line, borderRadius: 999, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 999 }} />
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Feuille de test (bottom sheet)                                     */
/* ------------------------------------------------------------------ */
function TestSheet({ perfume, stat, raters, onClose, onSave, onDelete }) {
  const [noteA, setNoteA] = useState(0);
  const [noteB, setNoteB] = useState(0);
  const [comment, setComment] = useState("");

  const canSave = noteA > 0 || noteB > 0;

  function save() {
    if (!canSave) return;
    onSave(perfume.id, noteA, noteB, comment);
    setNoteA(0);
    setNoteB(0);
    setComment("");
  }

  return (
    <Overlay onClose={onClose}>
      <div style={{ padding: "20px 20px 28px", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ width: 38, height: 4, background: C.line, borderRadius: 999, margin: "0 auto 18px" }} />

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
          <div>
            <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 23, color: C.ink, margin: 0 }}>
              {perfume.name}
            </h2>
            <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12.5, color: C.muted, margin: "3px 0 0" }}>
              {perfume.brand} · {perfume.conc}
            </p>
          </div>
          <button onClick={onClose} style={{ ...iconBtn, padding: "6px 10px" }}>
            Fermer
          </button>
        </div>

        <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12.5, color: C.muted, margin: "14px 0 4px" }}>
          Test n°{stat.count + 1} · aujourd'hui
        </p>

        <RatingRow label={raters.a} color={C.a} value={noteA} onChange={setNoteA} />
        <RatingRow label={raters.b} color={C.b} value={noteB} onChange={setNoteB} />

        <input
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          placeholder="Un mot, une impression… (optionnel)"
          style={{
            width: "100%",
            marginTop: 16,
            padding: "12px 14px",
            borderRadius: 12,
            border: `1px solid ${C.line}`,
            background: "#fff",
            fontFamily: "Hanken Grotesk, sans-serif",
            fontSize: 14,
            color: C.ink,
            outline: "none",
          }}
        />

        <button
          onClick={save}
          disabled={!canSave}
          style={{
            width: "100%",
            marginTop: 16,
            padding: "14px",
            borderRadius: 12,
            background: canSave ? C.ink : C.line,
            color: canSave ? C.paper : C.muted,
            fontFamily: "Hanken Grotesk, sans-serif",
            fontWeight: 600,
            fontSize: 15,
          }}
        >
          Enregistrer ce test
        </button>

        {/* Historique */}
        {stat.sessions.length > 0 && (
          <div style={{ marginTop: 24 }}>
            <p
              style={{
                fontFamily: "Hanken Grotesk, sans-serif",
                fontSize: 11,
                textTransform: "uppercase",
                letterSpacing: "0.08em",
                color: C.muted,
                margin: "0 0 8px",
              }}
            >
              Historique
            </p>
            {stat.sessions.map((s) => (
              <div
                key={s.id}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 10,
                  padding: "10px 0",
                  borderTop: `1px solid ${C.line}`,
                }}
              >
                <span style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 12, color: C.muted, width: 54 }}>
                  {dateFR(s.ts)}
                </span>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 14, color: C.a, fontWeight: 600 }}>
                  {s.noteA ?? "–"}
                </span>
                <span style={{ fontFamily: "Fraunces, serif", fontSize: 14, color: C.b, fontWeight: 600 }}>
                  {s.noteB ?? "–"}
                </span>
                <span
                  style={{
                    fontFamily: "Hanken Grotesk, sans-serif",
                    fontSize: 12.5,
                    color: C.ink,
                    flex: 1,
                    overflow: "hidden",
                    textOverflow: "ellipsis",
                    whiteSpace: "nowrap",
                  }}
                >
                  {s.comment || <span style={{ color: C.line }}>—</span>}
                </span>
                <button
                  onClick={() => onDelete(s.id)}
                  style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 11, color: C.muted }}
                >
                  Suppr.
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </Overlay>
  );
}

function RatingRow({ label, color, value, onChange }) {
  const selected = SCALE.find((s) => s.v === value);
  return (
    <div style={{ marginTop: 16 }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontFamily: "Hanken Grotesk, sans-serif",
          fontSize: 13,
          marginBottom: 8,
        }}
      >
        <span style={{ color: C.ink, fontWeight: 600 }}>
          <Dot c={color} /> {label}
        </span>
        <span style={{ color: selected ? color : C.muted, fontWeight: 500 }}>
          {selected ? selected.label : "à noter"}
        </span>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        {SCALE.map((s) => {
          const on = s.v === value;
          return (
            <button
              key={s.v}
              onClick={() => onChange(on ? 0 : s.v)}
              style={{
                flex: 1,
                aspectRatio: "1",
                borderRadius: 999,
                border: `1.5px solid ${on ? color : C.line}`,
                background: on ? color : "#fff",
                color: on ? "#fff" : C.muted,
                fontFamily: "Fraunces, serif",
                fontWeight: 600,
                fontSize: 17,
                transform: on ? "scale(1.06)" : "none",
                transition: "transform .12s ease",
              }}
            >
              {s.v}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Réglages                                                           */
/* ------------------------------------------------------------------ */
function SettingsSheet({ raters, onClose, onSaveNames, onReset }) {
  const [a, setA] = useState(raters.a);
  const [b, setB] = useState(raters.b);
  const [confirmReset, setConfirmReset] = useState(false);

  function save() {
    onSaveNames(a, b);
    onClose();
  }

  return (
    <Overlay onClose={onClose}>
      <div style={{ padding: "20px 20px 28px" }}>
        <div style={{ width: 38, height: 4, background: C.line, borderRadius: 999, margin: "0 auto 18px" }} />
        <h2 style={{ fontFamily: "Fraunces, serif", fontWeight: 600, fontSize: 22, color: C.ink, margin: "0 0 16px" }}>
          Réglages
        </h2>

        <label style={lbl}>Premier testeur</label>
        <input value={a} onChange={(e) => setA(e.target.value)} style={inp} />
        <label style={{ ...lbl, marginTop: 14 }}>Second testeur</label>
        <input value={b} onChange={(e) => setB(e.target.value)} style={inp} />

        <button
          onClick={save}
          style={{
            width: "100%",
            marginTop: 18,
            padding: 14,
            borderRadius: 12,
            background: C.ink,
            color: C.paper,
            fontFamily: "Hanken Grotesk, sans-serif",
            fontWeight: 600,
            fontSize: 15,
          }}
        >
          Enregistrer
        </button>

        <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 22, paddingTop: 16 }}>
          {!confirmReset ? (
            <button
              onClick={() => setConfirmReset(true)}
              style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 13, color: C.muted }}
            >
              Effacer tous les tests
            </button>
          ) : (
            <div>
              <p style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 13, color: C.ink, margin: "0 0 8px" }}>
                Sûr ? Tous les tests seront perdus.
              </p>
              <div style={{ display: "flex", gap: 10 }}>
                <button
                  onClick={() => {
                    onReset();
                    setConfirmReset(false);
                    onClose();
                  }}
                  style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 13, color: "#fff", background: C.a, padding: "8px 14px", borderRadius: 10 }}
                >
                  Oui, effacer
                </button>
                <button
                  onClick={() => setConfirmReset(false)}
                  style={{ fontFamily: "Hanken Grotesk, sans-serif", fontSize: 13, color: C.muted, padding: "8px 14px" }}
                >
                  Annuler
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </Overlay>
  );
}

const lbl = {
  fontFamily: "Hanken Grotesk, sans-serif",
  fontSize: 12,
  color: C.muted,
  display: "block",
  marginBottom: 5,
};
const inp = {
  width: "100%",
  padding: "11px 13px",
  borderRadius: 11,
  border: `1px solid ${C.line}`,
  background: "#fff",
  fontFamily: "Hanken Grotesk, sans-serif",
  fontSize: 14,
  color: C.ink,
  outline: "none",
};

/* ------------------------------------------------------------------ */
/*  Overlay générique                                                  */
/* ------------------------------------------------------------------ */
function Overlay({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(35,32,26,0.45)",
        display: "flex",
        alignItems: "flex-end",
        justifyContent: "center",
        animation: "fade .2s ease",
        zIndex: 50,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%",
          maxWidth: 480,
          background: C.paper,
          borderRadius: "22px 22px 0 0",
          animation: "rise .26s cubic-bezier(.2,.8,.2,1)",
        }}
      >
        {children}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Montage                                                            */
/* ------------------------------------------------------------------ */
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
