<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Carnet olfactif" />
  <meta name="theme-color" content="#FFFFFF" />
  <title>Carnet olfactif</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #FFFFFF; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
const { useState, useMemo } = React;

/* ------------------------------------------------------------------ */
/*  Données fixes                                                      */
/* ------------------------------------------------------------------ */
const DEFAULT_PERFUMES = [
  { id: "layton", name: "Layton", brand: "Parfums de Marly", conc: "EDP" },
  { id: "couleur-nuit", name: "La Couleur de la Nuit", brand: "Voyages Imaginaires", conc: "EDP" },
  { id: "sel-marin", name: "Sel Marin", brand: "Heeley", conc: "EDP" },
  { id: "african-leather", name: "African Leather", brand: "Memo", conc: "EDP" },
  { id: "megamare", name: "Megamare", brand: "Orto Parisi", conc: "Extrait" },
  { id: "herod", name: "Herod", brand: "Parfums de Marly", conc: "EDP" },
  { id: "b683", name: "B683", brand: "Marc-Antoine Barrois", conc: "EDP" },
  { id: "geranium-odorata", name: "Géranium Odorata", brand: "Diptyque", conc: "EDT" },
];

const SCALE = [
  { v: 1, label: "Non" },
  { v: 2, label: "Bof" },
  { v: 3, label: "Sympa" },
  { v: 4, label: "J'aime" },
  { v: 5, label: "Whoaou" },
];

const MOMENTS = [
  { id: "matin", label: "Matin", sub: "T+30min" },
  { id: "midi", label: "Midi", sub: "T+2h" },
  { id: "aprem", label: "Aprem", sub: "T+6h" },
  { id: "autre", label: "Autre", sub: "libre" },
];
const MOMENT_LABEL = { matin: "Matin", midi: "Midi", aprem: "Aprem", autre: "Autre" };

const STORAGE_KEY = "parfum-suivi-v1";

/* ------------------------------------------------------------------ */
/*  Style — palette couture épurée                                     */
/* ------------------------------------------------------------------ */
const C = {
  bg: "#FFFFFF",
  ink: "#1A1A1A",
  muted: "#8E8E8E",
  faint: "#B8B8B8",
  line: "#E6E6E6",
  a: "#B14E2A",
  b: "#2E665E",
  c: "#9C6B28",
  d: "#586349",
};

const HEAD = "'Jost', sans-serif";
const BODY = "'Hanken Grotesk', sans-serif";

const RATER_KEYS = ["a", "b", "c", "d"];
const RATER_DEFAULTS = { a: "Moi", b: "Ma copine", c: "Ma mère", d: "Autres testeurs" };
const RATER_COLORS = { a: C.a, b: C.b, c: C.c, d: C.d };

/* ------------------------------------------------------------------ */
/*  Persistance                                                        */
/* ------------------------------------------------------------------ */
const DEFAULT_DATA = {
  raters: { ...RATER_DEFAULTS },
  perfumes: [...DEFAULT_PERFUMES],
  sessions: [],
};

const STORAGE_OK = (() => {
  try {
    const k = "__carnet_test__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return true;
  } catch (e) {
    return false;
  }
})();

/* migration : tests anciens (sans moment, sans notes:{}) + perfumes par défaut si absents */
function migrate(data) {
  const raters = { ...RATER_DEFAULTS, ...(data && data.raters ? data.raters : {}) };
  const perfumes = data && Array.isArray(data.perfumes) && data.perfumes.length
    ? data.perfumes
    : [...DEFAULT_PERFUMES];
  const rawSessions = data && Array.isArray(data.sessions) ? data.sessions : [];
  const sessions = rawSessions.map((s) => {
    let notes = s.notes;
    if (!notes) notes = { a: s.noteA || null, b: s.noteB || null, c: null, d: null };
    return {
      id: s.id,
      perfumeId: s.perfumeId,
      ts: s.ts,
      comment: s.comment || "",
      moment: s.moment || "autre",
      notes,
    };
  });
  return { raters, perfumes, sessions };
}

function loadData() {
  if (!STORAGE_OK) return DEFAULT_DATA;
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) {
    console.error("Lecture impossible", e);
  }
  return DEFAULT_DATA;
}

function persist(data) {
  if (!STORAGE_OK) return false;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  } catch (e) {
    console.error("Sauvegarde impossible", e);
    return false;
  }
}

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
const avg = (arr) => (arr.length ? arr.reduce((s, n) => s + n, 0) / arr.length : null);
const fmt = (n) => (n == null ? "–" : n.toFixed(1).replace(".", ","));
const dateFR = (iso) =>
  new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const slug = (s) =>
  s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "parfum";

/* ------------------------------------------------------------------ */
/*  App                                                                */
/* ------------------------------------------------------------------ */
function App() {
  const [data, setData] = useState(() => loadData());
  const [active, setActive] = useState(null);
  const [settings, setSettings] = useState(false);
  const [addingPerfume, setAddingPerfume] = useState(false);
  const [saveStatus, setSaveStatus] = useState("idle");

  function commit(next) {
    setData(next);
    const ok = persist(next);
    setSaveStatus(ok ? "saved" : "failed");
    if (ok) setTimeout(() => setSaveStatus((s) => (s === "saved" ? "idle" : s)), 1500);
  }

  function addSession(perfumeId, moment, notes, comment) {
    const session = {
      id: Date.now().toString(36),
      perfumeId,
      ts: new Date().toISOString(),
      moment,
      notes: {
        a: notes.a || null,
        b: notes.b || null,
        c: notes.c || null,
        d: notes.d || null,
      },
      comment: comment.trim(),
    };
    commit({ ...data, sessions: [session, ...data.sessions] });
  }
  function deleteSession(id) {
    commit({ ...data, sessions: data.sessions.filter((s) => s.id !== id) });
  }
  function setRaters(next) {
    const clean = {};
    for (const k of RATER_KEYS) clean[k] = (next[k] || "").trim() || RATER_DEFAULTS[k];
    commit({ ...data, raters: clean });
  }
  function addPerfume({ name, brand, conc }) {
    const trimmedName = (name || "").trim();
    if (!trimmedName) return;
    const baseId = slug(trimmedName);
    let id = baseId;
    let i = 2;
    while (data.perfumes.some((p) => p.id === id)) id = `${baseId}-${i++}`;
    const perfume = {
      id,
      name: trimmedName,
      brand: (brand || "").trim() || "—",
      conc: (conc || "").trim() || "EDP",
      custom: true,
    };
    commit({ ...data, perfumes: [...data.perfumes, perfume] });
  }
  function removePerfume(perfumeId) {
    commit({
      ...data,
      perfumes: data.perfumes.filter((p) => p.id !== perfumeId),
      sessions: data.sessions.filter((s) => s.perfumeId !== perfumeId),
    });
  }
  function resetAll() {
    commit({ raters: data.raters, perfumes: data.perfumes, sessions: [] });
  }

  /* stats par parfum */
  const stats = useMemo(() => {
    const map = {};
    for (const p of data.perfumes) {
      const ss = data.sessions.filter((s) => s.perfumeId === p.id);
      const byRater = {};
      const byMoment = {};
      let all = [];
      for (const k of RATER_KEYS) {
        const notes = ss.map((s) => s.notes[k]).filter(Boolean);
        byRater[k] = avg(notes);
        all = all.concat(notes);
      }
      for (const m of MOMENTS) {
        const notes = ss
          .filter((s) => s.moment === m.id)
          .flatMap((s) => RATER_KEYS.map((k) => s.notes[k]).filter(Boolean));
        byMoment[m.id] = avg(notes);
      }
      map[p.id] = {
        count: ss.length,
        byRater,
        byMoment,
        combined: avg(all),
        sessions: ss,
      };
    }
    return map;
  }, [data.sessions, data.perfumes]);

  /* dernier parfum testé */
  const lastTested = useMemo(() => {
    if (data.sessions.length === 0) return null;
    const lastSession = data.sessions[0];
    const p = data.perfumes.find((p) => p.id === lastSession.perfumeId);
    if (!p) return null;
    return { perfume: p, session: lastSession };
  }, [data.sessions, data.perfumes]);

  /* classement */
  const ranked = useMemo(() => {
    const tested = data.perfumes.filter((p) => stats[p.id].count > 0).sort(
      (x, y) => stats[y.id].combined - stats[x.id].combined
    );
    const untested = data.perfumes.filter((p) => stats[p.id].count === 0);
    return { tested, untested };
  }, [stats, data.perfumes]);

  const totalTests = data.sessions.length;
  const triedCount = data.perfumes.length - ranked.untested.length;

  return (
    <Shell>
      {/* En-tête */}
      <header style={{ padding: "32px 22px 18px" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h1
              style={{
                fontFamily: HEAD,
                fontWeight: 400,
                fontSize: 23,
                lineHeight: 1.1,
                color: C.ink,
                margin: 0,
                textTransform: "uppercase",
                letterSpacing: "0.18em",
              }}
            >
              Carnet olfactif
            </h1>
            <p
              style={{
                fontFamily: BODY,
                fontSize: 10.5,
                color: C.muted,
                margin: "9px 0 0",
                textTransform: "uppercase",
                letterSpacing: "0.12em",
              }}
            >
              {data.perfumes.length} échantillons — {totalTests} test{totalTests > 1 ? "s" : ""} — {triedCount}/{data.perfumes.length} goûtés
            </p>
          </div>
          <button onClick={() => setSettings(true)} style={iconBtn}>
            Réglages
          </button>
        </div>
        {!STORAGE_OK && <Notice color={C.a}>Stockage indisponible sur ce navigateur (mode privé ?) — les notes ne seront pas gardées.</Notice>}
        {STORAGE_OK && saveStatus === "failed" && <Notice color={C.a}>Échec de sauvegarde — rouvre le parfum et ré-enregistre le test.</Notice>}
        {STORAGE_OK && saveStatus === "saved" && <Notice color={C.b}>Enregistré</Notice>}
      </header>

      {/* Légende testeurs */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          gap: "7px 18px",
          padding: "0 22px 20px",
          fontFamily: BODY,
          fontSize: 10,
          color: C.muted,
          textTransform: "uppercase",
          letterSpacing: "0.08em",
        }}
      >
        {RATER_KEYS.map((k) => (
          <span key={k}><Dot c={RATER_COLORS[k]} /> {data.raters[k]}</span>
        ))}
      </div>

      {/* Dernier porté */}
      {lastTested && (
        <LastWornBlock
          perfume={lastTested.perfume}
          session={lastTested.session}
          onTap={() => setActive(lastTested.perfume.id)}
        />
      )}

      {/* Classement */}
      <main style={{ padding: "0 22px 32px" }}>
        <div style={{ borderTop: `1px solid ${C.line}` }}>
          {ranked.tested.map((p, i) => (
            <PerfumeRow
              key={p.id}
              perfume={p}
              stat={stats[p.id]}
              rank={i + 1}
              raters={data.raters}
              isTop={i === 0 && stats[p.id].count >= 2}
              onTap={() => setActive(p.id)}
            />
          ))}
        </div>

        {ranked.untested.length > 0 && (
          <p
            style={{
              fontFamily: BODY,
              fontSize: 10,
              textTransform: "uppercase",
              letterSpacing: "0.14em",
              color: C.faint,
              margin: "32px 0 0",
            }}
          >
            Pas encore testés
          </p>
        )}
        <div style={{ borderTop: ranked.untested.length > 0 ? `1px solid ${C.line}` : "none", marginTop: 10 }}>
          {ranked.untested.map((p) => (
            <PerfumeRow
              key={p.id}
              perfume={p}
              stat={stats[p.id]}
              rank={null}
              raters={data.raters}
              isTop={false}
              onTap={() => setActive(p.id)}
            />
          ))}
        </div>

        {/* Bouton ajouter parfum */}
        <button
          onClick={() => setAddingPerfume(true)}
          style={{
            width: "100%",
            marginTop: 22,
            padding: "14px",
            borderRadius: 0,
            background: "#fff",
            color: C.ink,
            border: `1px dashed ${C.line}`,
            fontFamily: BODY,
            fontWeight: 500,
            fontSize: 11,
            textTransform: "uppercase",
            letterSpacing: "0.14em",
          }}
        >
          + Ajouter un parfum
        </button>
      </main>

      {/* Feuille de test */}
      {active && (
        <TestSheet
          perfume={data.perfumes.find((p) => p.id === active)}
          stat={stats[active]}
          raters={data.raters}
          onClose={() => setActive(null)}
          onSave={addSession}
          onDelete={deleteSession}
          onRemovePerfume={removePerfume}
        />
      )}

      {/* Ajout parfum */}
      {addingPerfume && (
        <AddPerfumeSheet
          onClose={() => setAddingPerfume(false)}
          onSave={(p) => { addPerfume(p); setAddingPerfume(false); }}
        />
      )}

      {/* Réglages */}
      {settings && (
        <SettingsSheet
          raters={data.raters}
          onClose={() => setSettings(false)}
          onSaveNames={setRaters}
          onReset={resetAll}
        />
      )}
    </Shell>
  );
}

/* ------------------------------------------------------------------ */
/*  Dernier porté — bloc épinglé en haut                               */
/* ------------------------------------------------------------------ */
function LastWornBlock({ perfume, session, onTap }) {
  const today = new Date();
  const sessionDate = new Date(session.ts);
  const isToday = today.toDateString() === sessionDate.toDateString();
  const dayLabel = isToday ? "Aujourd'hui" : dateFR(session.ts);

  return (
    <button
      onClick={onTap}
      style={{
        margin: "0 22px 26px",
        padding: "16px 18px",
        background: C.ink,
        color: "#fff",
        border: "none",
        borderRadius: 0,
        display: "block",
        width: "calc(100% - 44px)",
        textAlign: "left",
        animation: "fade .4s ease both",
      }}
    >
      <div
        style={{
          fontFamily: BODY,
          fontSize: 9.5,
          textTransform: "uppercase",
          letterSpacing: "0.18em",
          color: "rgba(255,255,255,0.65)",
          marginBottom: 8,
        }}
      >
        {dayLabel} — Dernier porté
      </div>
      <div
        style={{
          fontFamily: HEAD,
          fontWeight: 400,
          fontSize: 21,
          color: "#fff",
          letterSpacing: "0.04em",
        }}
      >
        {perfume.name}
      </div>
      <div
        style={{
          fontFamily: BODY,
          fontSize: 10.5,
          color: "rgba(255,255,255,0.7)",
          marginTop: 6,
          textTransform: "uppercase",
          letterSpacing: "0.08em",
        }}
      >
        {perfume.brand} — {perfume.conc}
      </div>
      <div
        style={{
          fontFamily: BODY,
          fontSize: 10.5,
          color: "#fff",
          marginTop: 12,
          fontWeight: 500,
          textTransform: "uppercase",
          letterSpacing: "0.14em",
        }}
      >
        Noter ce test →
      </div>
    </button>
  );
}

/* ------------------------------------------------------------------ */
/*  Coquille                                                           */
/* ------------------------------------------------------------------ */
function Shell({ children }) {
  return (
    <div style={{ minHeight: "100vh", background: C.bg }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; border: none; background: none; }
        @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      `}</style>
      <div style={{ maxWidth: 480, margin: "0 auto" }}>{children}</div>
    </div>
  );
}

const iconBtn = {
  fontFamily: BODY,
  fontSize: 10,
  color: C.ink,
  border: `1px solid ${C.ink}`,
  borderRadius: 0,
  padding: "8px 14px",
  textTransform: "uppercase",
  letterSpacing: "0.12em",
};

function Notice({ children, color }) {
  return (
    <p
      style={{
        fontFamily: BODY,
        fontSize: 11,
        color: color,
        margin: "14px 0 0",
        lineHeight: 1.5,
        textTransform: "uppercase",
        letterSpacing: "0.06em",
      }}
    >
      {children}
    </p>
  );
}

function Dot({ c }) {
  return (
    <span
      style={{
        display: "inline-block",
        width: 6,
        height: 6,
        borderRadius: 999,
        background: c,
        marginRight: 6,
        verticalAlign: "middle",
      }}
    />
  );
}

/* ------------------------------------------------------------------ */
/*  Ligne parfum                                                       */
/* ------------------------------------------------------------------ */
function PerfumeRow({ perfume, stat, rank, raters, isTop, onTap }) {
  const tested = stat.count > 0;
  const activeRaters = RATER_KEYS.filter((k) => stat.byRater[k] != null);
  const activeMoments = MOMENTS.filter((m) => stat.byMoment[m.id] != null);

  return (
    <button
      onClick={onTap}
      style={{
        width: "100%",
        textAlign: "left",
        background: "transparent",
        borderBottom: `1px solid ${isTop ? C.a : C.line}`,
        padding: "18px 0",
        display: "block",
        animation: "fade .4s ease both",
      }}
    >
      {isTop && (
        <div
          style={{
            fontFamily: BODY,
            fontSize: 9.5,
            fontWeight: 600,
            letterSpacing: "0.16em",
            textTransform: "uppercase",
            color: C.a,
            marginBottom: 7,
          }}
        >
          ✦ Coup de cœur
        </div>
      )}
      <div style={{ display: "flex", justifyContent: "space-between", gap: 14, alignItems: "baseline" }}>
        <div style={{ minWidth: 0 }}>
          <div
            style={{
              fontFamily: HEAD,
              fontWeight: 400,
              fontSize: 18,
              color: C.ink,
              letterSpacing: "0.04em",
            }}
          >
            {rank && <span style={{ color: C.faint, fontSize: 14, marginRight: 2 }}>{String(rank).padStart(2, "0")}</span>} {perfume.name}
          </div>
          <div
            style={{
              fontFamily: BODY,
              fontSize: 10.5,
              color: C.muted,
              marginTop: 4,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}
          >
            {perfume.brand} — {perfume.conc}
          </div>
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontFamily: HEAD, fontWeight: 300, fontSize: 30, color: tested ? C.ink : C.faint, lineHeight: 1 }}>
            {fmt(stat.combined)}
            <span style={{ fontSize: 12, color: C.faint }}> /5</span>
          </div>
          <div
            style={{
              fontFamily: BODY,
              fontSize: 9.5,
              color: C.muted,
              marginTop: 5,
              textTransform: "uppercase",
              letterSpacing: "0.08em",
            }}
          >
            {tested ? `${stat.count} test${stat.count > 1 ? "s" : ""}` : "à tester"}
          </div>
        </div>
      </div>

      {tested && activeRaters.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: "10px 16px", marginTop: 14 }}>
          {activeRaters.map((k) => (
            <MiniBar key={k} label={raters[k]} value={stat.byRater[k]} color={RATER_COLORS[k]} />
          ))}
        </div>
      )}

      {tested && activeMoments.length > 0 && (
        <div
          style={{
            display: "flex",
            flexWrap: "wrap",
            gap: "0 14px",
            marginTop: 12,
            fontFamily: BODY,
            fontSize: 9.5,
            color: C.muted,
            textTransform: "uppercase",
            letterSpacing: "0.08em",
          }}
        >
          {activeMoments.map((m) => (
            <span key={m.id}>
              {m.label} <span style={{ color: C.ink, fontWeight: 600 }}>{fmt(stat.byMoment[m.id])}</span>
            </span>
          ))}
        </div>
      )}

      {!tested && (
        <div
          style={{
            fontFamily: BODY,
            fontSize: 10,
            color: C.ink,
            marginTop: 12,
            fontWeight: 500,
            textTransform: "uppercase",
            letterSpacing: "0.12em",
          }}
        >
          Lancer un test →
        </div>
      )}
    </button>
  );
}

function MiniBar({ label, value, color }) {
  const pct = value ? (value / 5) * 100 : 0;
  return (
    <div style={{ flex: "1 1 42%", minWidth: 110 }}>
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          fontFamily: BODY,
          fontSize: 9.5,
          color: C.muted,
          marginBottom: 4,
          textTransform: "uppercase",
          letterSpacing: "0.06em",
        }}
      >
        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</span>
        <span style={{ color: C.ink, fontWeight: 600, paddingLeft: 6 }}>{fmt(value)}</span>
      </div>
      <div style={{ height: 3, background: C.line, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: color }} />
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Feuille de test                                                    */
/* ------------------------------------------------------------------ */
function TestSheet({ perfume, stat, raters, onClose, onSave, onDelete, onRemovePerfume }) {
  const [moment, setMoment] = useState("matin");
  const [notes, setNotes] = useState({ a: 0, b: 0, c: 0, d: 0 });
  const [comment, setComment] = useState("");
  const [confirmRemove, setConfirmRemove] = useState(false);

  const canSave = RATER_KEYS.some((k) => notes[k] > 0);

  function setNote(k, v) { setNotes((n) => ({ ...n, [k]: v })); }
  function save() {
    if (!canSave) return;
    onSave(perfume.id, moment, notes, comment);
    setNotes({ a: 0, b: 0, c: 0, d: 0 });
    setComment("");
  }

  return (
    <Overlay onClose={onClose}>
      <div style={{ padding: "16px 22px 30px", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ width: 32, height: 2, background: C.line, margin: "0 auto 22px" }} />

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div>
            <h2 style={{ fontFamily: HEAD, fontWeight: 400, fontSize: 21, color: C.ink, margin: 0, letterSpacing: "0.05em" }}>
              {perfume.name}
            </h2>
            <p style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, margin: "5px 0 0", textTransform: "uppercase", letterSpacing: "0.08em" }}>
              {perfume.brand} — {perfume.conc}
            </p>
          </div>
          <button onClick={onClose} style={{ ...iconBtn, padding: "7px 12px" }}>Fermer</button>
        </div>

        {/* Sélecteur de moment */}
        <p style={{ fontFamily: BODY, fontSize: 10, color: C.faint, margin: "22px 0 8px", textTransform: "uppercase", letterSpacing: "0.14em" }}>
          Quel moment du test ?
        </p>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
          {MOMENTS.map((m) => {
            const on = moment === m.id;
            return (
              <button
                key={m.id}
                onClick={() => setMoment(m.id)}
                style={{
                  padding: "10px 4px",
                  borderRadius: 0,
                  border: `1px solid ${on ? C.ink : C.line}`,
                  background: on ? C.ink : "#fff",
                  color: on ? "#fff" : C.ink,
                  fontFamily: BODY,
                  fontSize: 11,
                  fontWeight: 600,
                  textTransform: "uppercase",
                  letterSpacing: "0.08em",
                  lineHeight: 1.3,
                }}
              >
                {m.label}
                <div style={{ fontSize: 9, fontWeight: 400, letterSpacing: "0.04em", marginTop: 3, color: on ? "rgba(255,255,255,0.7)" : C.faint }}>
                  {m.sub}
                </div>
              </button>
            );
          })}
        </div>

        <p style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, margin: "22px 0 0", textTransform: "uppercase", letterSpacing: "0.06em" }}>
          Test n°{stat.count + 1} — note qui était là, laisse le reste vide
        </p>

        {RATER_KEYS.map((k) => (
          <RatingRow key={k} label={raters[k]} color={RATER_COLORS[k]} value={notes[k]} onChange={(v) => setNote(k, v)} />
        ))}

        <input
          value={comment}
          onChange={(e) => setComment(e.target.value)}
          placeholder="Un mot, une impression… (optionnel)"
          style={{
            width: "100%",
            marginTop: 20,
            padding: "13px 14px",
            borderRadius: 0,
            border: `1px solid ${C.line}`,
            background: "#fff",
            fontFamily: BODY,
            fontSize: 14,
            color: C.ink,
            outline: "none",
          }}
        />

        <button
          onClick={save}
          disabled={!canSave}
          style={{
            width: "100%",
            marginTop: 16,
            padding: "15px",
            borderRadius: 0,
            background: canSave ? C.ink : "#fff",
            color: canSave ? "#fff" : C.faint,
            border: `1px solid ${canSave ? C.ink : C.line}`,
            fontFamily: BODY,
            fontWeight: 600,
            fontSize: 12,
            textTransform: "uppercase",
            letterSpacing: "0.16em",
          }}
        >
          Enregistrer ce test
        </button>

        {/* Historique */}
        {stat.sessions.length > 0 && (
          <div style={{ marginTop: 30 }}>
            <p style={{ fontFamily: BODY, fontSize: 10, textTransform: "uppercase", letterSpacing: "0.14em", color: C.faint, margin: "0 0 4px" }}>
              Historique
            </p>
            {stat.sessions.map((s) => (
              <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 9, padding: "12px 0", borderTop: `1px solid ${C.line}` }}>
                <span style={{ fontFamily: BODY, fontSize: 10, color: C.muted, width: 46, flexShrink: 0, textTransform: "uppercase", letterSpacing: "0.04em" }}>
                  {dateFR(s.ts)}
                </span>
                <span style={{ fontFamily: BODY, fontSize: 9.5, color: C.ink, width: 46, flexShrink: 0, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 500 }}>
                  {MOMENT_LABEL[s.moment] || "—"}
                </span>
                <span style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  {RATER_KEYS.map((k) => (
                    <span key={k} style={{ fontFamily: HEAD, fontSize: 14, fontWeight: 400, color: s.notes[k] ? RATER_COLORS[k] : C.line, width: 11, textAlign: "center" }}>
                      {s.notes[k] || "·"}
                    </span>
                  ))}
                </span>
                <span style={{ fontFamily: BODY, fontSize: 12, color: C.ink, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", minWidth: 0 }}>
                  {s.comment || <span style={{ color: C.faint }}>—</span>}
                </span>
                <button onClick={() => onDelete(s.id)} style={{ fontFamily: BODY, fontSize: 9.5, color: C.muted, flexShrink: 0, textTransform: "uppercase", letterSpacing: "0.08em" }}>
                  Suppr.
                </button>
              </div>
            ))}
          </div>
        )}

        {/* Suppression parfum custom */}
        {perfume.custom && (
          <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 24, paddingTop: 18 }}>
            {!confirmRemove ? (
              <button onClick={() => setConfirmRemove(true)} style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                Supprimer ce parfum
              </button>
            ) : (
              <div>
                <p style={{ fontFamily: BODY, fontSize: 11.5, color: C.ink, margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.06em" }}>
                  Sûr ? Le parfum et ses tests seront perdus.
                </p>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => { onRemovePerfume(perfume.id); onClose(); }} style={{ fontFamily: BODY, fontSize: 10.5, color: "#fff", background: C.a, padding: "10px 16px", borderRadius: 0, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                    Oui, supprimer
                  </button>
                  <button onClick={() => setConfirmRemove(false)} style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, padding: "10px 16px", textTransform: "uppercase", letterSpacing: "0.1em" }}>
                    Annuler
                  </button>
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </Overlay>
  );
}

function RatingRow({ label, color, value, onChange }) {
  const selected = SCALE.find((s) => s.v === value);
  return (
    <div style={{ marginTop: 20 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: BODY, fontSize: 11, marginBottom: 9, textTransform: "uppercase", letterSpacing: "0.08em" }}>
        <span style={{ color: C.ink, fontWeight: 600 }}>
          <Dot c={color} /> {label}
        </span>
        <span style={{ color: selected ? color : C.faint, fontWeight: 500 }}>
          {selected ? selected.label : "à noter"}
        </span>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        {SCALE.map((s) => {
          const on = s.v === value;
          return (
            <button
              key={s.v}
              onClick={() => onChange(on ? 0 : s.v)}
              style={{
                flex: 1,
                aspectRatio: "1",
                borderRadius: 0,
                border: `1px solid ${on ? color : C.line}`,
                background: on ? color : "#fff",
                color: on ? "#fff" : C.muted,
                fontFamily: HEAD,
                fontWeight: 400,
                fontSize: 16,
                transition: "background .12s ease, border-color .12s ease",
              }}
            >
              {s.v}
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Ajout parfum                                                       */
/* ------------------------------------------------------------------ */
function AddPerfumeSheet({ onClose, onSave }) {
  const [name, setName] = useState("");
  const [brand, setBrand] = useState("");
  const [conc, setConc] = useState("EDP");
  const canSave = name.trim().length > 0;

  return (
    <Overlay onClose={onClose}>
      <div style={{ padding: "16px 22px 30px" }}>
        <div style={{ width: 32, height: 2, background: C.line, margin: "0 auto 22px" }} />
        <h2 style={{ fontFamily: HEAD, fontWeight: 400, fontSize: 20, color: C.ink, margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.12em" }}>
          Nouveau parfum
        </h2>
        <p style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, margin: "0 0 20px", textTransform: "uppercase", letterSpacing: "0.06em", lineHeight: 1.5 }}>
          Le nom suffit. Marque et concentration sont optionnelles.
        </p>

        <label style={lbl}>Nom du parfum</label>
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Ex. Aventus" style={inp} autoFocus />

        <label style={{ ...lbl, marginTop: 14 }}>Marque</label>
        <input value={brand} onChange={(e) => setBrand(e.target.value)} placeholder="Ex. Creed" style={inp} />

        <label style={{ ...lbl, marginTop: 14 }}>Concentration</label>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6 }}>
          {["EDT", "EDP", "Extrait", "Cologne"].map((opt) => {
            const on = conc === opt;
            return (
              <button
                key={opt}
                onClick={() => setConc(opt)}
                style={{
                  padding: "10px 4px",
                  borderRadius: 0,
                  border: `1px solid ${on ? C.ink : C.line}`,
                  background: on ? C.ink : "#fff",
                  color: on ? "#fff" : C.ink,
                  fontFamily: BODY,
                  fontSize: 11,
                  fontWeight: 500,
                  textTransform: "uppercase",
                  letterSpacing: "0.08em",
                }}
              >
                {opt}
              </button>
            );
          })}
        </div>

        <button
          onClick={() => canSave && onSave({ name, brand, conc })}
          disabled={!canSave}
          style={{
            width: "100%",
            marginTop: 22,
            padding: 15,
            borderRadius: 0,
            background: canSave ? C.ink : "#fff",
            color: canSave ? "#fff" : C.faint,
            border: `1px solid ${canSave ? C.ink : C.line}`,
            fontFamily: BODY,
            fontWeight: 600,
            fontSize: 12,
            textTransform: "uppercase",
            letterSpacing: "0.16em",
          }}
        >
          Ajouter
        </button>
      </div>
    </Overlay>
  );
}

/* ------------------------------------------------------------------ */
/*  Réglages                                                           */
/* ------------------------------------------------------------------ */
function SettingsSheet({ raters, onClose, onSaveNames, onReset }) {
  const [names, setNames] = useState({ ...raters });
  const [confirmReset, setConfirmReset] = useState(false);

  function setName(k, v) { setNames((n) => ({ ...n, [k]: v })); }
  function save() { onSaveNames(names); onClose(); }

  const labels = { a: "Testeur 1", b: "Testeur 2", c: "Testeur 3", d: "Testeur 4" };

  return (
    <Overlay onClose={onClose}>
      <div style={{ padding: "16px 22px 30px", maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ width: 32, height: 2, background: C.line, margin: "0 auto 22px" }} />
        <h2 style={{ fontFamily: HEAD, fontWeight: 400, fontSize: 20, color: C.ink, margin: "0 0 6px", textTransform: "uppercase", letterSpacing: "0.12em" }}>
          Réglages
        </h2>
        <p style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, margin: "0 0 20px", textTransform: "uppercase", letterSpacing: "0.06em", lineHeight: 1.5 }}>
          Renomme les testeurs. Laisse vide pour revenir au nom par défaut.
        </p>

        {RATER_KEYS.map((k, i) => (
          <div key={k} style={{ marginTop: i === 0 ? 0 : 16 }}>
            <label style={lbl}><Dot c={RATER_COLORS[k]} /> {labels[k]}</label>
            <input value={names[k]} onChange={(e) => setName(k, e.target.value)} style={inp} />
          </div>
        ))}

        <button
          onClick={save}
          style={{
            width: "100%",
            marginTop: 22,
            padding: 15,
            borderRadius: 0,
            background: C.ink,
            color: "#fff",
            border: `1px solid ${C.ink}`,
            fontFamily: BODY,
            fontWeight: 600,
            fontSize: 12,
            textTransform: "uppercase",
            letterSpacing: "0.16em",
          }}
        >
          Enregistrer
        </button>

        <div style={{ borderTop: `1px solid ${C.line}`, marginTop: 26, paddingTop: 18 }}>
          {!confirmReset ? (
            <button onClick={() => setConfirmReset(true)} style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, textTransform: "uppercase", letterSpacing: "0.1em" }}>
              Effacer tous les tests
            </button>
          ) : (
            <div>
              <p style={{ fontFamily: BODY, fontSize: 11.5, color: C.ink, margin: "0 0 10px", textTransform: "uppercase", letterSpacing: "0.06em" }}>
                Sûr ? Tous les tests seront perdus.
              </p>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => { onReset(); setConfirmReset(false); onClose(); }} style={{ fontFamily: BODY, fontSize: 10.5, color: "#fff", background: C.a, padding: "10px 16px", borderRadius: 0, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                  Oui, effacer
                </button>
                <button onClick={() => setConfirmReset(false)} style={{ fontFamily: BODY, fontSize: 10.5, color: C.muted, padding: "10px 16px", textTransform: "uppercase", letterSpacing: "0.1em" }}>
                  Annuler
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </Overlay>
  );
}

const lbl = {
  fontFamily: BODY,
  fontSize: 10,
  color: C.muted,
  display: "block",
  marginBottom: 6,
  textTransform: "uppercase",
  letterSpacing: "0.1em",
};
const inp = {
  width: "100%",
  padding: "12px 13px",
  borderRadius: 0,
  border: `1px solid ${C.line}`,
  background: "#fff",
  fontFamily: BODY,
  fontSize: 14,
  color: C.ink,
  outline: "none",
};

/* ------------------------------------------------------------------ */
/*  Overlay générique                                                  */
/* ------------------------------------------------------------------ */
function Overlay({ children, onClose }) {
  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(26,26,26,0.4)",
        display: "flex",
        alignItems: "flex-end",
        justifyContent: "center",
        animation: "fade .2s ease",
        zIndex: 50,
      }}
    >
      <div
        onClick={(e) => e.stopPropagation()}
        style={{
          width: "100%",
          maxWidth: 480,
          background: C.bg,
          borderRadius: "2px 2px 0 0",
          animation: "rise .26s cubic-bezier(.2,.8,.2,1)",
        }}
      >
        {children}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
